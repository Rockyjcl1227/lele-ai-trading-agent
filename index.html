<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f5">
  <title>乐乐的 AI Trading Agent</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles-v2.css?v=20260905-2">
  <script src="config.js" defer></script>
  <script src="mock.js" defer></script>
  <script src="state.js" defer></script>
  <script src="api.js?v=20260905-4" defer></script>
  <script src="ai-engine.js" defer></script>
  <script src="app-v2.js?v=20260905-6" defer></script>
</head>
<body>
  <main class="stage" aria-label="乐乐的 AI Trading Agent 移动端应用">
    <section class="phone" aria-label="iPhone 机模">
      <div class="phone-speaker" aria-hidden="true"><i></i></div>
      <header class="status-bar">
        <time id="system-time">09:41</time>
        <div class="status-icons" aria-label="网络及电池状态">
          <svg class="cellular-icon" viewBox="0 0 18 12" aria-hidden="true"><rect x="1" y="8" width="2.5" height="3" rx=".7"/><rect x="5.5" y="6" width="2.5" height="5" rx=".7"/><rect x="10" y="3.5" width="2.5" height="7.5" rx=".7"/><rect x="14.5" y="1" width="2.5" height="10" rx=".7"/></svg>
          <svg class="wifi-icon" viewBox="0 0 18 13" aria-hidden="true"><path d="M1 4.5C5.5.8 12.5.8 17 4.5"/><path d="M4 7.5c2.8-2.2 7.2-2.2 10 0"/><path d="M7 10.2c1.1-.9 2.9-.9 4 0"/><circle cx="9" cy="11.3" r=".7"/></svg>
          <svg class="battery-icon" viewBox="0 0 29 13" aria-hidden="true"><rect x=".7" y="1.2" width="24" height="10.6" rx="3"/><path d="M26.2 4.3v4.4"/><rect class="battery-fill" x="2.6" y="3.1" width="19.8" height="6.8" rx="1.6"/></svg>
        </div>
      </header>

      <div class="app-viewport">
        <section id="app-content" aria-live="polite"></section>
      </div>

      <nav class="bottom-nav" aria-label="主导航">
        <button type="button" data-nav="home" aria-label="首页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
          <span>首页</span>
        </button>
        <button type="button" data-nav="market" aria-label="行情">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
          <span>行情</span>
        </button>
        <button type="button" data-nav="watch" aria-label="自选">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6.2 6.8 1-4.9 4.8 1.2 6.8-6.1-3.2-6.1 3.2 1.2-6.8-4.9-4.8 6.8-1Z"/></svg>
          <span>自选</span>
        </button>
        <button type="button" class="ai-nav" data-nav="ai" aria-label="问财">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14v10H9l-4 3v-13Z"/><path d="M9 9h6M9 12h4"/><path d="m18 2 .5 1.5L20 4l-1.5.5L18 6l-.5-1.5L16 4l1.5-.5L18 2Z"/></svg>
          <span>问财</span>
        </button>
        <button type="button" data-nav="news" aria-label="资讯">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h5"/></svg>
          <span>资讯</span>
        </button>
        <button type="button" data-nav="trade" aria-label="交易">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M6 3h12l2 4v13H4V7zM8 12h8M8 16h5"/></svg>
          <span>交易</span>
        </button>
      </nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
</body>
</html>
